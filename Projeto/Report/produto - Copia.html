<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Cadastro Produtos - Relatório</title>
        <style>
            @page {
                size: A4 landscape;
                margin: 12mm 10mm 10mm;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: #fff;
                color: #111;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 8.6pt;
            }
            .page {
                width: 100%;
                max-width: 1120px;
                margin: 0 auto;
                padding: 12px;
            }
            .top {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
            }
            h1 {
                font-size: 18px;
                margin: 0 0 8px;
            }
            .page-info {
                text-align: right;
                font-size: 9pt;
                line-height: 1.5;
            }
            .subtitle {
                font-weight: 700;
                font-size: 12.5px;
                margin: 12px 0 10px;
                border-bottom: 1px solid #222;
                padding-bottom: 7px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed;
            }
            th {
                background: #5f5f5f;
                color: #fff;
                font-weight: 700;
                border-bottom: 2px solid #111;
                padding: 4px 5px;
                text-align: left;
                white-space: nowrap;
            }
            td {
                padding: 3.2px 5px;
                vertical-align: top;
                border-bottom: 0;
                white-space: normal;
            }
            th:nth-child(1),
            td:nth-child(1) {
                width: 7.2%;
            }
            th:nth-child(2),
            td:nth-child(2) {
                width: 18.5%
            }
            th:nth-child(3),
            td:nth-child(3) {
                width: 10.5%;				
            }
            th:nth-child(4),
            td:nth-child(4) {
                width: 10.5%;
            }
            th:nth-child(5),
            td:nth-child(5) {
                width: 10.5%;
                text-align: center;
            }
            th:nth-child(6),
            td:nth-child(6) {
                width: 10,5%;
            }
            th:nth-child(7),
            td:nth-child(7) {
                width: 10,5%;
            }
            th:nth-child(8),
            td:nth-child(8) {
                width: 10.5%;
            }
            .total {
                margin-top: 12px;
                border-top: 1px solid #777;
                padding-top: 8px;
                text-align: right;
                font-size: 12px;
                font-weight: 700;
            }
            .footer {
                margin-top: 42px;
                text-align: center;
                font-size: 8.5px;
                line-height: 1.5;
            }
            .footer .sql {
                margin-top: 3px;
                font-family: "Courier New", monospace;
            }
            .legend {
                margin-top: 2px;
            }
            .copyright {
                margin-top: 2px;
            }
            .qr-note {
                display: none;
            }
            @media print {
                .page {
                    max-width: none;
                    padding: 0;
                }
                body {
                    font-size: 8.2pt;
                }
                th {
                    background: #5f5f5f !important;
                    -webkit-print-color-adjust: exact;
                    print-color-adjust: exact;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="top">
                <div><h1>CADASTRO PRODUTOS</h1></div>
                <div class="page-info">
                    <div>Página [@REGINICIAL] de&nbsp;&nbsp;[@TOTALREG]</div>
                    <div>[@DATAEXTENSO]</div>
                </div>
            </div>
            <div class="subtitle">[@TITULO]</div>
            <table>
                <thead>
                    <tr>
                        <th>CÓDIGO</th>
                        <th>NOME DO PRODUTO</th>
                        <th>PREÇO COMPRA</th>
                        <th>PREÇO VENDA</th>
                        <th>QUANTIDADE</th>
                        <th>TOTAL PAGO R$</th>
                        <th>PREÇO TABELA</th>
                        <th>ÚLTIMO PREÇO</th>
                    </tr>
                </thead>
                <tbody>
					[@BODY]
                </tbody>
            </table>

            <div class="total">Total de registro(s) Listado(s): &nbsp; [@TOTALREG]</div>

            <div class="footer">
                <div>Programa Exemplo</div>
                <div class="copyright">
                    (c) Copyright Ipage Software -
                    <a href="https://www.ipage.com.br" target="_blank">www.ipage.com.br</a>
                </div>
            </div>
        </div>
    </body>
</html>
